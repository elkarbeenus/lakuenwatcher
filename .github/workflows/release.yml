name: Release

# Neues Release: in extension/manifest.json "version_name" erhöhen und auf main pushen.
#   "0.2.0"          → Release v0.2.0
#   "0.2.0-test.1"   → Testbuild v0.2.0-test.1
# Gibt es das Release schon, passiert nichts. Alternativ: Actions → Release → "Run workflow".
on:
  push:
    branches: [main]
    paths: ["extension/manifest.json", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Version lesen
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="$(python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version_name"])')"
          TAG="v$NAME"
          BASE="$(echo "$NAME" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')"
          TESTNR="$(echo "$NAME" | grep -oiE 'test[.-]?[0-9]+' | grep -oE '[0-9]+$' || true)"
          if [ -n "$TESTNR" ]; then
            NUM="$BASE.$TESTNR"; TEST=true; TITLE="LakuenWatcher v$BASE test $TESTNR (Testbuild)"
          else
            NUM="$BASE"; TEST=false; TITLE="LakuenWatcher v$BASE"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG gibt es schon – nichts zu tun."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "num=$NUM" >> "$GITHUB_OUTPUT"
          echo "test=$TEST" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Tests
        if: steps.ver.outputs.skip == 'false'
        run: node tests/run.mjs

      - name: Paket bauen
        if: steps.ver.outputs.skip == 'false'
        run: |
          # Chrome braucht in "version" reine Zahlen (Testbuild 0.2.0-test.3 → 0.2.0.3)
          python3 - "${{ steps.ver.outputs.num }}" <<'PY'
          import json, sys
          p = "extension/manifest.json"
          m = json.load(open(p, encoding="utf-8"))
          m["version"] = sys.argv[1]
          json.dump(m, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
          mkdir -p dist
          ZIP="LakuenWatcher-${{ steps.ver.outputs.tag }}.zip"
          (cd extension && zip -qr "../dist/$ZIP" . -x "updater.json")
          (cd dist && sha256sum "$ZIP" > "$ZIP.sha256")
          cp scripts/install.sh scripts/update.sh dist/
          ls -la dist

      # Testbuilds werden absichtlich NICHT als "Pre-release" markiert, damit der
      # Updater in der Erweiterung sie über releases/latest findet.
      - name: Release veröffentlichen
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.ver.outputs.test }}" = "true" ]; then
            { echo "**Testbuild** – wird durch das nächste Release ersetzt."; echo; cat RELEASE_NOTES.md 2>/dev/null || true; } > notes.md
          else
            cp RELEASE_NOTES.md notes.md 2>/dev/null || echo "Neue Version." > notes.md
          fi
          gh release create "${{ steps.ver.outputs.tag }}" dist/* \
            --target "${{ github.sha }}" \
            --title "${{ steps.ver.outputs.title }}" \
            --notes-file notes.md
